name: Build Flutter Web

on:
  push:
    branches: [main, master, windown]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
      - run: tar -czf alatalolile-web.tar.gz -C build web
      - uses: actions/upload-artifact@v4
        with:
          name: alatalolile-web
          path: alatalolile-web.tar.gz
