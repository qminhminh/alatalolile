name: Build Flutter Linux

on:
  push:
    branches: [main, master, windown]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter analyze
      - name: Build Linux ${{ matrix.architecture }}
        run: flutter build linux --release
      - name: Verify Linux bundle
        run: ls -la build/linux/${{ matrix.architecture }}/release/bundle
      - name: Archive Linux ${{ matrix.architecture }}
        run: tar -czf alatalolile-linux-${{ matrix.architecture }}.tar.gz -C build/linux/${{ matrix.architecture }}/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: alatalolile-linux-${{ matrix.architecture }}
          path: alatalolile-linux-${{ matrix.architecture }}.tar.gz
          retention-days: 7
