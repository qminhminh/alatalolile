name: Build Android APK

on:
  push:
    branches: [main, master, windown]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter analyze
      - name: Build APK with network retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Gradle download failed; retrying in 20 seconds (attempt $attempt/3)"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: alatalolile-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
