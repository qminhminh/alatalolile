name: Build Android

on:
  push:
    branches: [main, master, windown]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java version
        run: java -version
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - run: flutter pub get
      - name: Install Android SDK 36 and NDK 28.2
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.2.13676358"
      - run: flutter analyze
      - name: Build APK with network retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --android-skip-build-dependency-validation && exit 0
            echo "Gradle download failed; retrying in 20 seconds (attempt $attempt/3)"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: alatalolile-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
