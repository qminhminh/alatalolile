workflows:
  windows-release:
    name: Alatalolile Windows Release
    instance_type: windows_x2
    max_build_duration: 60

    environment:
      flutter: stable
      vars:
        CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Enable Windows desktop
        script: flutter config --enable-windows-desktop

      - name: Analyze Flutter project
        script: flutter analyze

      - name: Build Windows release
        script: flutter build windows --release

      - name: Package Windows application
        script: |
          cd build/windows/x64/runner/Release
          7z a -r ../../../../../alatalolile-windows.zip ./*

    artifacts:
      - alatalolile-windows.zip

  macos-release:
    name: Alatalolile macOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter project
        script: flutter analyze

      - name: Build macOS release
        script: flutter build macos --release

      - name: Package macOS application
        script: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(find . -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            ../../../../../alatalolile-macos.zip

    artifacts:
      - alatalolile-macos.zip
