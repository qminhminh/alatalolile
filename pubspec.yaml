name: alatalolile
description: "alatalolile"
publish_to: 'none'


version: 11.0.0+34

environment:
  sdk: ^3.14.0


dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.2.5
  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  http: ^1.6.0
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  webview_all: ^1.5.2
  better_player: ^1.37.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/videos/he_he_he.mp4

 
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  color_dark: "#000000"
  image_dark: assets/images/logo.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#000000"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#000000"

  web: true
  web_image_mode: center

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#000000"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
